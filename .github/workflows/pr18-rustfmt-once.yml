name: pr18-rustfmt-once
on:
  push:
    branches: [security/issue-5-mcp-scan-approvals]
    paths:
      - .github/workflows/pr18-rustfmt-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'utksh1/SecuScan-v2' && github.ref == 'refs/heads/security/issue-5-mcp-scan-approvals'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/issue-5-mcp-scan-approvals
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and commit change
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          if ! git diff --quiet -- crates; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates
            git commit -m "style(mcp): rustfmt scoped approval API and tests"
            git push origin HEAD:security/issue-5-mcp-scan-approvals
          fi
