# Native HTTP default-credential auditor (Basic + form).
[plugin]
id = "password-audit"
name = "Password Auditor"
version = "1.1.0"
description = "Test HTTP Basic or form login against well-known default credentials"
long_description = """
Checks whether a login still accepts default or never-changed credentials
(admin:admin, root:toor, vendor defaults). Supports HTTP Basic and a
single POST form. The embedded list is intentionally small — default
pairs only, not a brute-force dictionary. For service anonymous/empty
passwords (FTP, Redis, MySQL, …) use service-defaults.
"""
category = "exploitation"
author = "SecuScan Contributors"
license = "MIT"
icon = "key-round"
difficulty = "intermediate"
tags = ["auth", "passwords", "http", "defaults"]

[engine]
type = "native"
native = "password_audit"
timeout_seconds = 600

[[fields]]
id = "target"
label = "Target URL"
type = "string"
required = true
placeholder = "https://router.example.com/admin"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~-]*$'
message = "Must be a valid URL"

[[fields]]
id = "protocol"
label = "Protocol"
type = "select"
default = "http-basic"
options = [
  { value = "http-basic", label = "HTTP Basic" },
  { value = "http-form", label = "HTTP form POST" },
]

[[fields]]
id = "login_url"
label = "Form login URL (http-form)"
type = "string"
placeholder = "https://app.example.com/login"

[[fields]]
id = "user_field"
label = "Username field"
type = "string"
default = "username"

[[fields]]
id = "pass_field"
label = "Password field"
type = "string"
default = "password"

[[fields]]
id = "wordlist"
label = "Custom credentials file (optional)"
type = "string"
placeholder = "/path/to/creds.txt"
pattern = '^[/a-zA-Z0-9._@!$%^&*()-]*$'
help = "Lines of user:pass. Empty = embedded default list."

[[fields]]
id = "mode"
label = "Attack mode"
type = "select"
default = "dictionary"
options = [
  { value = "dictionary", label = "Dictionary (one password per username)" },
  { value = "spray", label = "Password spray (one password across all usernames)" },
]
help = "Spray mode respects lockout pacing; dictionary tries every pair."

[[fields]]
id = "delay_ms"
label = "Delay between attempts (ms)"
type = "integer"
default = 0
min = 0
max = 600000
help = "Fixed delay between authentication attempts (0 = as fast as the server accepts)."

[[fields]]
id = "lockout_pause_ms"
label = "Lockout pause (ms)"
type = "integer"
default = 0
min = 0
max = 600000
help = "Pause after every N attempts (attempts_per_period) — avoids account lockout during spray."

[[fields]]
id = "attempts_per_period"
label = "Attempts per lockout period"
type = "integer"
default = 0
min = 0
max = 50000
help = "0 = no periodic pause; e.g. 5 with lockout_pause_ms=600000 = 5 attempts then 10-min cooldown."

[[fields]]
id = "timeout_ms"
label = "Request timeout (ms)"
type = "integer"
default = 8000
min = 500
max = 30000

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Sends authentication attempts with known default credential pairs. Only audit systems you own."
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
