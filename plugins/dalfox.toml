# dalfox wrapper -- purpose-built XSS scanner with JSONL output.
#
# dalfox v3+ mines parameters, injects context-aware payloads, and
# verifies execution (DOM marker analysis) before reporting. Its
# type_description distinguishes "Vulnerable -- dalfox asserts this
# input is exploitable" from plain reflections, so findings arrive as
# validated issues with the exact payload + evidence attached.
[plugin]
id = "xss-scanner"
name = "XSS Scanner (dalfox)"
version = "3.0.0"
description = "Verified reflected and DOM cross-site scripting with dalfox"
long_description = """
Wraps dalfox v3, a purpose-built XSS scanner: parameter mining,
context-aware payload injection, DOM sink analysis and verification
before anything is reported. Output is normalized from dalfox's
structured JSONL -- each finding carries the payload, the evidence,
the injection location (Query / Body / Header / Path), the CWE, and a
confidence rating. Findings land in the XSS category so the Sniper
Auto-Exploiter XSS chain (OOB callback handler) can follow up.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "bug"
difficulty = "intermediate"
tags = ["web", "xss", "injection"]

[engine]
type = "cli"
binary = "dalfox"
timeout_seconds = 1800
output_format = "json_lines"
argv = [
  "dalfox",
  "url", "{target}",
  "--no-color",
  "-S",
  "-f", "jsonl",
  # dalfox exits non-zero (1) when it finds XSS (grep convention); the
  # code below documents that as non-error (issue #11) so the task still
  # completes while any OTHER non-zero exit now fails honestly.
  "--if:only_vulnerable:then:--only-poc",
  "--if:only_vulnerable:then:v",
  "--if:param:then:-p",
  "--if:param:then:{param}",
]

[[fields]]
id = "target"
label = "Target URL with parameters"
type = "string"
required = true
placeholder = "https://example.com/search?q=test"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~{}()-]*$'
message = "Must be a URL; include a parameter to test, e.g. ?q=test"

[[fields]]
id = "param"
label = "Parameter (optional)"
type = "string"
placeholder = "q"
help = "Test only this parameter; leave empty to mine all parameters."

[[fields]]
id = "only_vulnerable"
label = "Only verified vulnerabilities"
type = "boolean"
default = true
help = "Report only findings dalfox asserts are exploitable (type V). Disable to also see plain reflections."

[parser]
type = "json_lines"

[parser.finding]
# dalfox JSONL emits a meta summary line first (no message_str ->
# skipped) then one line per finding. message_str is human-readable:
# "Triggered XSS Payload (DOM marker): q=<svg onload=alert(1)...>"
title_field = "message_str"
description_field = "type_description"
severity_field = "severity"
url_field = "data"
proof_fields = ["payload", "evidence", "detection_method"]
# Routes to the Sniper XSS chain (xss-exploiter OOB callback handler).
category = "XSS"
# dalfox's "V" type means verified exploitable -- not a suspicion.
kind = "validated_issue"
# Copied into finding metadata (last path segment as key).
metadata_fields = [
  "cwe",
  "confidence",
  "confidence_reason",
  "inject_type",
  "location",
  "param",
  "method",
  "type",
]

[parser.severity_map]
critical = "critical"
high = "high"
medium = "medium"
low = "low"
info = "info"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "dalfox sends active XSS probe payloads. Only scan authorized targets."
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
binaries = ["dalfox"]

# ---------------------------------------------------------------- profiles ---

[presets.verified]
only_vulnerable = true

[preset_meta.verified]
label = "Verified only"
description = "Report only XSS dalfox asserts is exploitable (type V). Highest signal, fewer findings."
badge = "fast"

[presets.all-reflections]
only_vulnerable = false

[preset_meta.all-reflections]
label = "All reflections"
description = "Also include plain unverified reflections — useful for hardening reviews and sink hunting."
badge = "thorough"
