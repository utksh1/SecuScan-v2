# Anonymous / empty-password service probes via nmap NSE (no extra binary).
# Detection only: one script pass, not a credential dictionary.
[plugin]
id = "service-defaults"
name = "Service Defaults"
version = "1.1.0"
description = "Probe common services for anonymous or empty-password access"
long_description = """
Runs a curated nmap script list against well-known ports (FTP, SSH, Telnet,
SMTP, POP3, IMAP, SNMP, LDAP, SMB, MSSQL, MySQL, RDP, VNC, Redis, MongoDB,
PostgreSQL, Oracle listener). Scripts report anonymous login, empty
passwords, open relay, and similar defaults. Not a hydra-style brute force.

v4.2.1 adds three one-click scan profiles (Quick / Standard / Deep) that
mirror the pentest-tools.com customization surface — Quick checks the five
highest-signal services (FTP/SSH/Telnet/SNMP/SMB) only, Standard runs the
full default bundle, Deep adds smtp-commands, ldap-search, and
ms-sql-info for the widest coverage.
"""
category = "network"
author = "SecuScan Contributors"
license = "MIT"
icon = "key-round"
difficulty = "intermediate"
tags = ["defaults", "passwords", "nmap", "internal"]

[engine]
type = "cli"
binary = "nmap"
timeout_seconds = 900
output_format = "text"
argv = [
  "nmap",
  "-sV",
  "-p", "{ports}",
  "--script", "{scripts}",
  "{target}",
]

[[fields]]
id = "target"
label = "Target"
type = "string"
required = true
placeholder = "192.168.1.10"
pattern = '^[a-zA-Z0-9:\[][a-zA-Z0-9.:\[\]-]*(/\d{1,2})?$'
message = "Must be an IP, hostname, or CIDR range"

[[fields]]
id = "ports"
label = "Ports"
type = "string"
default = "21,22,23,25,110,143,161,389,445,1433,1521,3306,3389,5432,5900,6379,27017"
placeholder = "21,22,23,25,110,143,161,389,445,1433,1521,3306,3389,5432,5900,6379,27017"
pattern = '^[0-9,\- ]+$'
message = "Comma-separated TCP ports"
help = "Quick profile narrows to the top-5 default-credential services (21,22,23,161,445)."

[[fields]]
id = "scripts"
label = "NSE script bundle"
type = "string"
default = "ftp-anon,ssh-auth-methods,telnet-ntlm-info,smtp-open-relay,pop3-capabilities,imap-capabilities,snmp-info,ldap-rootdse,smb-enum-shares,ms-sql-empty-password,mysql-empty-password,rdp-enum-encryption,vnc-info,redis-info,mongodb-info"
placeholder = "ftp-anon,ssh-auth-methods,..."
pattern = '^[a-zA-Z0-9_.,-]+$'
message = "Comma-separated nmap NSE script names"
help = "Quick = top 5 service checks. Standard = full default bundle. Deep = adds smtp-commands, ldap-search, ms-sql-info."

[parser]
type = "line_regex"
pattern = '(?P<port>\d+)/(?P<proto>tcp)\s+open\s+(?P<service>[\w-]+)'

[parser.finding]
title = "Service open on {port}/{proto} ({service})"
description = "Review the raw NSE output for anonymous, empty-password, or open-relay evidence."
remediation = "Disable anonymous access, require authentication, and bind the service to a management network."
proof = "{proto} port {port} is OPEN ({service})"
category = "Network Service"
severity = "info"

[[static_rules]]
pattern = '(?i)anonymous.*login|empty password|no authentication|open relay|Guest account'
title = "Anonymous or empty-password access indicated"
severity = "high"
description = "An NSE script reported anonymous login, empty password, guest access, or an open relay."
remediation = "Require credentials, disable guest/anonymous, and close unused listeners."
category = "Authentication"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Probes well-known service ports with nmap default-access scripts. Only scan authorized hosts."
allowed_targets = [
  "127.0.0.1", "::1", "localhost",
  "10.*.*.*", "192.168.*.*",
  "172.16.*.*", "172.17.*.*", "172.18.*.*", "172.19.*.*", "172.20.*.*",
  "172.21.*.*", "172.22.*.*", "172.23.*.*", "172.24.*.*", "172.25.*.*",
  "172.26.*.*", "172.27.*.*", "172.28.*.*", "172.29.*.*", "172.30.*.*", "172.31.*.*",
]
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
binaries = ["nmap"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
ports = "21,22,23,161,445"
scripts = "ftp-anon,ssh-auth-methods,telnet-ntlm-info,snmp-info,smb-enum-shares"

[preset_meta.quick]
label = "Quick"
description = "Top-5 default-credential services only (FTP/SSH/Telnet/SNMP/SMB). Seconds-fast triage of the highest-signal default-access vectors."
badge = "fast"

[presets.standard]
ports = "21,22,23,25,110,143,161,389,445,1433,1521,3306,3389,5432,5900,6379,27017"
scripts = "ftp-anon,ssh-auth-methods,telnet-ntlm-info,smtp-open-relay,pop3-capabilities,imap-capabilities,snmp-info,ldap-rootdse,smb-enum-shares,ms-sql-empty-password,mysql-empty-password,rdp-enum-encryption,vnc-info,redis-info,mongodb-info"

[preset_meta.standard]
label = "Standard"
description = "Full default-access bundle across 17 well-known ports. The historical default."
badge = "thorough"

[presets.deep]
ports = "21,22,23,25,110,143,161,389,445,1433,1521,3306,3389,5432,5900,6379,27017"
scripts = "ftp-anon,ssh-auth-methods,telnet-ntlm-info,smtp-open-relay,smtp-commands,pop3-capabilities,imap-capabilities,snmp-info,ldap-rootdse,ldap-search,smb-enum-shares,ms-sql-empty-password,ms-sql-info,mysql-empty-password,rdp-enum-encryption,vnc-info,redis-info,mongodb-info"

[preset_meta.deep]
label = "Deep"
description = "Standard plus smtp-commands, ldap-search, and ms-sql-info. Widest coverage of default-access and enumeration vectors."
badge = "intense"
