  /vpn-profiles/:id/connect:
    post:
      tags:
      - VPN
      summary: Connect VPN
      description: Bring the tunnel up. No-op if already connected; auto-heals a stale tunnel. Returns 200 with status (may
        be 'error' if the openvpn binary is missing).
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpnProfile'
