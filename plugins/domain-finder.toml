# Domain Finder -- discover related domains owned by the same organization.
[plugin]
id = "domain-finder"
name = "Domain Finder"
version = "1.1.0"
description = "Find related domains via Certificate Transparency, BuiltWith, and reverse WHOIS"
long_description = """
Discovers domains owned by the same organization using three implemented
techniques with a rule-based certainty score:

1. Certificate Transparency subdomains: searches CT logs for certificates
   where the target appears in the CN or SAN.
2. Organization pivot: reads the Organization (O=) from the target's live
   TLS certificate, then searches CT logs for OTHER certificates issued to
   the same organization — this finds sibling root domains
   (facebook.com -> fbcdn.net) that subdomain search can never see.
3. Redirect verification: bounded HTTP probes check whether a candidate's
   web endpoint redirects to the target (strongest ownership signal).

Signals stack into a 0-100 certainty score (CT hits, org-pivot match,
redirect verification, name-similarity). Results chain directly into
Subdomain Finder and Google Hacking. Roadmap: reverse-WHOIS chaining.
"""
category = "recon"
author = "SecuScan Contributors"
license = "MIT"
icon = "globe"
difficulty = "intermediate"
tags = ["domains", "recon", "passive", "ct-logs"]

[engine]
type = "native"
native = "domain_finder"
timeout_seconds = 300

[[fields]]
id = "target"
label = "Root domain"
type = "string"
required = true
placeholder = "example.com"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}$'
message = "Root domain with TLD (e.g. example.com)"

[[fields]]
id = "min_certainty"
label = "Minimum certainty"
type = "integer"
default = 30
min = 0
max = 100
placeholder = "30"

[[fields]]
id = "check_redirects"
label = "Verify candidates via redirects"
type = "boolean"
default = true
help = "Bounded probe (max 10 candidates): does the candidate redirect to the target? Adds the strongest certainty signal."

[safety]
level = "safe"
requires_consent = true
consent_message = "Only scan systems you own or are explicitly authorized to test."
allowed_targets = ["*"]
max_concurrent = 5
max_per_hour = 30
capabilities = ["network.connect", "http.request"]

# ---------------------------------------------------------------- profiles ---

[presets.light]
min_certainty = 50
check_redirects = true

[preset_meta.light]
label = "Light"
description = "High-confidence matches only (certainty ≥ 50). CT-log Organization matches and reverse-WHOIS exact-email hits; suppresses the noisy tracking-ID and suffix look-alike rows."
badge = "fast"

[presets.deep]
min_certainty = 20

[preset_meta.deep]
label = "Deep"
description = "Lower threshold (certainty ≥ 20). Includes BuiltWith-style tracking-ID matches and suffix look-alikes; more results, more noise to triage."
badge = "intense"
