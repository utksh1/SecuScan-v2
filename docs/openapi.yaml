      parameters:
      - name: id
        in: path
        required: true
        description: Profile id.
        schema:
          type: string
  /workspaces/:id/vpn:
    get:
      tags:
      - VPN
      summary: Get workspace VPN pin
      description: Return the VPN profile pinned to a workspace (or null) with current status and openvpn_available flag,
        so the UI can warn before a user attempts a scan that will be rejected.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Workspace id.
        schema:
          type: string
    put:
      tags:
      - VPN
      summary: Set workspace VPN pin
      description: Pin (or unpin with null) a VPN profile to a workspace. Pinned workspaces refuse to admit tasks unless the
        tunnel can be brought up.
      security: *id001
      responses:
        '204':
          description: No content
        '404':
          description: No such VPN profile or workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Workspace id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vpn_profile_id:
                  type: string
                  nullable: true
