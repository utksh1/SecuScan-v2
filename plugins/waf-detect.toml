# wafw00f wrapper — WAF fingerprinting.
[plugin]
id = "waf-detect"
name = "WAF Detector (wafw00f)"
version = "1.1.0"
description = "Fingerprint web application firewalls in front of a site"
long_description = """
Wraps wafw00f, which sends benign probe requests and matches responses
against signatures of 200+ WAF products (Cloudflare, Akamai, ModSecurity,
AWS WAF, Imperva, ...). Knowing the WAF in front of a target shapes the
rest of the engagement.

v4.2.1 adds two one-click scan profiles (Quick / Deep) that mirror the
pentest-tools.com customization surface — Quick reports the single best-matching
WAF (one round of probes), Deep uses wafw00f's -a flag to enumerate every
WAF signature that fires.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "shield"
difficulty = "beginner"
tags = ["web", "waf", "fingerprinting", "recon"]

[engine]
type = "cli"
binary = "wafw00f"
timeout_seconds = 600
output_format = "text"
argv = [
  "wafw00f",
  "{target}",
  "-v",
  "--if:find_all:then:-a",
]

[[fields]]
id = "target"
label = "Target URL"
type = "string"
required = true
placeholder = "https://example.com"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_-]*$'
message = "Must be a URL"

[[fields]]
id = "find_all"
label = "Find all WAFs (-a)"
type = "boolean"
default = false
help = "Iterate every signature instead of stopping at the first match. Disabled in Quick, enabled in Deep."

[parser]
type = "line_regex"
# wafw00f verbose output:
#   [+] The site https://x is behind WAF: Cloudflare (Cloudflare Inc.)
#   [+] Generic Detection: ...
pattern = '^\[\+\].*behind (?:a )?WAF:\s*(?P<waf>[^(]+?)\s*(?:\((?P<vendor>[^)]+)\))?$'
metadata_fields = ["waf", "vendor"]

[parser.finding]
title = "WAF detected: {waf}"
description = "The target is protected by `{waf}`. Probe payloads from other scanners may be blocked or logged."
remediation = "No action needed on the WAF itself; keep this in mind when interpreting other scanners' results (false negatives are common behind WAFs)."
proof = "wafw00f: behind WAF {waf}"
category = "Web Server"
severity = "info"

[[parser.severity_rules]]
field = "waf"
values = ["*"]
severity = "info"

[safety]
level = "safe"
requires_consent = true
consent_message = "wafw00f sends a few benign detection requests."
max_concurrent = 2
max_per_hour = 60
capabilities = ["network"]

[dependencies]
binaries = ["wafw00f"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
find_all = false

[preset_meta.quick]
label = "Quick"
description = "Single best-match WAF fingerprint. One round of probes — fastest path to the headline answer."
badge = "fast"

[presets.deep]
find_all = true

[preset_meta.deep]
label = "Deep"
description = "Enumerate every WAF signature that fires (-a). Slower but uncovers layered / chained WAFs."
badge = "intense"
