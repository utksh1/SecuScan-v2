# SSH algorithm / auth-method audit via nmap NSE.
[plugin]
id = "ssh-audit"
name = "SSH Audit"
version = "1.1.0"
description = "Audit SSH host keys, auth methods, and weak algorithms on TCP/22"
long_description = """
Runs nmap ssh2-enum-algos, ssh-auth-methods and ssh-hostkey against port 22
(Standard profile). Weak ciphers, password-only auth, and missing public-key
auth are surfaced from the script output. Fully offline; uses the nmap
binary already required for the network suite.

v4.2.1 adds three one-click scan profiles (Quick / Standard / Deep) that
mirror the pentest-tools.com customization surface — Quick enumerates
algorithms only (seconds), Standard adds auth-method and host-key checks
(the historical default), Deep adds ssh-publickey-acceptance and the
ssh2-brute loader (NSE-driven, not a dictionary attack).
"""
category = "network"
author = "SecuScan Contributors"
license = "MIT"
icon = "lock-keyhole"
difficulty = "intermediate"
tags = ["ssh", "crypto", "internal"]

[engine]
type = "cli"
binary = "nmap"
timeout_seconds = 300
output_format = "text"
argv = [
  "nmap",
  "-p", "{ports}",
  "-sV",
  "--script", "{scripts}",
  "{target}",
]

[[fields]]
id = "target"
label = "Target"
type = "string"
required = true
placeholder = "192.168.1.10"
pattern = '^[a-zA-Z0-9:\[][a-zA-Z0-9.:\[\]-]*(/\d{1,2})?$'
message = "Must be an IP, hostname, or CIDR range"

[[fields]]
id = "ports"
label = "Ports"
type = "string"
default = "22"
placeholder = "22 or 22,2222"
pattern = '^[0-9,\- ]+$'
message = "Comma-separated TCP ports"
help = "SSH is normally on 22; add 2222 for shifted instances."

[[fields]]
id = "scripts"
label = "NSE script bundle"
type = "string"
default = "ssh2-enum-algos,ssh-auth-methods,ssh-hostkey"
placeholder = "ssh2-enum-algos,ssh-auth-methods,ssh-hostkey"
pattern = '^[a-zA-Z0-9_.,-]+$'
message = "Comma-separated nmap NSE script names"
help = "Quick = ssh2-enum-algos. Standard = adds ssh-auth-methods + ssh-hostkey. Deep = adds ssh-publickey-acceptance + ssh2-brute loader."

[parser]
type = "line_regex"
pattern = '(?P<port>22|2222)/(?P<proto>tcp)\s+open\s+(?P<service>[\w-]+)'

[parser.finding]
title = "SSH service open on {port}/{proto} ({service})"
description = "TCP {port} is open. Review raw output for kex/cipher lists and advertised auth methods."
remediation = "Disable password auth if possible; remove CBC, MD5, and ssh-dss; keep current OpenSSH."
proof = "{proto} port {port} is OPEN ({service})"
category = "Network Service"
severity = "info"

[[static_rules]]
pattern = '(?i)password'
title = "SSH advertises password authentication"
severity = "medium"
description = "ssh-auth-methods listed password. Password auth is brute-forceable and weaker than publickey."
remediation = "Set PasswordAuthentication no and use public-key (or a hardware token) only."
category = "Misconfiguration"

[[static_rules]]
pattern = '(?i)diffie-hellman-group1-sha1|ssh-dss|arcfour|cbc'
title = "SSH offers a weak algorithm"
severity = "medium"
description = "nmap listed a legacy SSH algorithm (group1-sha1, ssh-dss, arcfour, or CBC)."
remediation = "Restrict HostKeyAlgorithms, KexAlgorithms, and Ciphers to modern sets (curve25519, aes256-gcm)."
category = "Cryptography"

[safety]
level = "safe"
requires_consent = true
consent_message = "Connects to TCP 22 and enumerates algorithms. Only scan authorized hosts."
allowed_targets = [
  "127.0.0.1", "::1", "localhost",
  "10.*.*.*", "192.168.*.*",
  "172.16.*.*", "172.17.*.*", "172.18.*.*", "172.19.*.*", "172.20.*.*",
  "172.21.*.*", "172.22.*.*", "172.23.*.*", "172.24.*.*", "172.25.*.*",
  "172.26.*.*", "172.27.*.*", "172.28.*.*", "172.29.*.*", "172.30.*.*", "172.31.*.*",
]
max_concurrent = 4
max_per_hour = 40
capabilities = ["network"]

[dependencies]
binaries = ["nmap"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
ports = "22"
scripts = "ssh2-enum-algos"

[preset_meta.quick]
label = "Quick"
description = "Algorithm enumeration only: kex / cipher / MAC lists in seconds. No auth-method or host-key check."
badge = "fast"

[presets.standard]
ports = "22"
scripts = "ssh2-enum-algos,ssh-auth-methods,ssh-hostkey"

[preset_meta.standard]
label = "Standard"
description = "Algorithms + advertised auth methods + host-key fingerprint. The historical default."
badge = "thorough"

[presets.deep]
ports = "22,2222"
scripts = "ssh2-enum-algos,ssh-auth-methods,ssh-hostkey,ssh-publickey-acceptance,ssh2-brute"

[preset_meta.deep]
label = "Deep"
description = "Standard plus ssh-publickey-acceptance (verifies offered keys are accepted) and the ssh2-brute loader (NSE-driven, not a dictionary attack). Also probes port 2222."
badge = "intense"
