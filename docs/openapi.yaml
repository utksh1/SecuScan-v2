        error:
          type: string
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    VpnProfile:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - disconnected
          - connecting
          - connected
          - error
        last_error:
          type: string
          nullable: true
        interface:
          type: string
          nullable: true
        connected_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        config_size:
          type: integer
        openvpn_available:
          type: boolean
        config_text:
          type: string
        error:
          type: string
    Robot:
      type: object
