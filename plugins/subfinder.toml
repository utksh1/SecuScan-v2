# subfinder wrapper — passive subdomain enumeration (projectdiscovery).
[plugin]
id = "subfinder"
name = "Subdomain Finder (subfinder, passive)"
version = "1.1.0"
description = "Passive subdomain discovery from public data sources"
long_description = """
Wraps subfinder for passive subdomain enumeration: it queries dozens of
public sources (certificate transparency, DNS aggregators, search archives)
without touching the target's own infrastructure. No API keys required for
the default sources.

v4.2.1 adds three one-click scan profiles (Light / Standard / Exhaustive)
that mirror the pentest-tools.com customization surface — Light runs a
flat non-recursive query against the default source set, Standard adds
recursive enumeration of discovered zones, Exhaustive also surfaces
wildcard-parked hosts (filtered by default to reduce noise).
"""
category = "recon"
author = "SecuScan Contributors"
license = "MIT"
icon = "radar"
difficulty = "beginner"
tags = ["dns", "subdomains", "passive", "osint"]

[engine]
type = "cli"
binary = "subfinder"
timeout_seconds = 900
output_format = "text"
argv = [
  "subfinder",
  "-d", "{target}",
  "-silent",
  "--if:exclude_wildcard:then:-nW",
  "--if:recursive:then:-recursive",
]

[[fields]]
id = "target"
label = "Domain"
type = "string"
required = true
placeholder = "example.com"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
message = "Must be a DNS name"

[[fields]]
id = "exclude_wildcard"
label = "Filter wildcard hosts"
type = "boolean"
default = true
help = "Drop hosts that resolve to a wildcard-parked IP. Disabled in the Exhaustive profile."

[[fields]]
id = "recursive"
label = "Recursive enumeration"
type = "boolean"
default = false
help = "Re-run subfinder against each discovered zone. Disabled in Light, enabled in Standard and Exhaustive."

[parser]
type = "line_regex"
# subfinder -silent prints one domain per line
pattern = '^(?P<sub>(?:[a-zA-Z0-9_-]+\.)+[a-zA-Z]{2,})$'
metadata_fields = ["sub"]

[parser.finding]
title = "Subdomain: {sub}"
description = "subfinder discovered `{sub}` from passive public sources — no requests were sent to the target."
remediation = "Review each discovered host for stale deployments and apply the same hardening baseline as primary domains."
proof = "{sub}"
category = "DNS"
severity = "info"

[safety]
level = "safe"
requires_consent = true
consent_message = "subfinder queries public third-party sources about the domain."
max_concurrent = 2
max_per_hour = 30
capabilities = ["network"]

[dependencies]
binaries = ["subfinder"]

# ---------------------------------------------------------------- profiles ---

[presets.light]
recursive = false
exclude_wildcard = true

[preset_meta.light]
label = "Light"
description = "Flat non-recursive query against the default source set, wildcards filtered. Seconds-fast passive triage."
badge = "fast"

[presets.standard]
recursive = true
exclude_wildcard = true

[preset_meta.standard]
label = "Standard"
description = "Recursive enumeration of discovered zones, wildcards still filtered. The historical default depth."
badge = "thorough"

[presets.exhaustive]
recursive = true
exclude_wildcard = false

[preset_meta.exhaustive]
label = "Exhaustive"
description = "Recursive enumeration, wildcards surfaced (no -nW). Most complete coverage but adds parked-host noise."
badge = "intense"
