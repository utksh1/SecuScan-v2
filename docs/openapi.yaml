            text/html:
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Long-lived API key (admin-issued).
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
            message:
              type: string
    Task:
      type: object
      required:
      - id
      - plugin_id
      - plugin_name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        plugin_id:
          type: string
        plugin_name:
          type: string
        target:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        inputs:
          type: object
          additionalProperties: true
        options:
          type: object
          additionalProperties: true
        exit_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        stats:
          type: object
          additionalProperties: true
        output_truncated:
          type: boolean
        workflow_run_id:
          type: string
          nullable: true
        workspace_id:
          type: string
          nullable: true
        schedule_id:
          type: string
          nullable: true
        robot_run_id:
          type: string
          nullable: true
        auth_profile_id:
          type: string
          nullable: true
        oob_marker:
          type: string
          nullable: true
        sniper_run_id:
          type: string
          nullable: true
        vpn_profile_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    Finding:
      type: object
      required:
      - id
      - task_id
      - plugin_id
      - severity
      - title
      - kind
      - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        plugin_id:
          type: string
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
        title:
          type: string
        description:
          type: string
        evidence:
          type: string
        remediation:
          type: string
        url:
          type: string
          nullable: true
        category:
          type: string
        kind:
          type: string
          enum:
          - suspected_issue
          - validated_issue
          - info
          - noise
        analyst_status:
          type: string
          enum:
          - new
          - confirmed
          - needs_review
          - false_positive
          - accepted_risk
          - fixed
        cve:
          type: string
          nullable: true
        cvss_v3:
          type: number
          nullable: true
        epss_score:
          type: number
          nullable: true
        cisa_kev:
          type: boolean
        cwe:
          type: string
          nullable: true
        owasp:
          type: string
          nullable: true
        confidence:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Plugin:
      type: object
      required:
      - id
      - name
      - engine
      - available
      - enabled
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        engine:
          type: object
        fields:
          type: array
          items:
            type: object
        available:
          type: boolean
        enabled:
          type: boolean
        requires_consent:
          type: boolean
        category:
          type: string
    Workspace:
      type: object
      required:
      - id
      - name
      - created_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        vpn_profile_id:
          type: string
          nullable: true
        tasks_total:
          type: integer
        tasks_active:
          type: integer
        targets_total:
          type: integer
    ScanTarget:
      type: object
      required:
      - id
      - workspace_id
      - name
      - kind
      - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - hostname
          - ip_address
          - url
        description:
          type: string
        scans_total:
          type: integer
        last_scanned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Workflow:
      type: object
      required:
      - id
      - name
      - steps
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
    Schedule:
      type: object
      required:
      - id
      - plugin_id
      - interval_seconds
      - next_run_at
      - enabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plugin_id:
          type: string
        target:
          type: string
          nullable: true
        interval_seconds:
          type: integer
        next_run_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        workspace_id:
          type: string
          nullable: true
    Report:
      type: object
      required:
      - id
      - format
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        format:
          type: string
          enum:
          - pdf
          - html
          - csv
          - xlsx
          - json
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        scope:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    DashboardSummary:
      type: object
      properties:
        tasks_total:
          type: integer
        tasks_active:
          type: integer
        findings_total:
          type: integer
        findings_critical:
          type: integer
        findings_high:
          type: integer
        plugins_available:
          type: integer
        recent_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        severity_counts:
          type: object
          additionalProperties:
            type: integer
    SniperRun:
      type: object
      required:
      - id
      - finding_id
      - status
      - steps
      - created_at
      properties:
        id:
          type: string
          format: uuid
        finding_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          nullable: true
        category:
          type: string
        target:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        steps:
          type: array
          items:
            type: object
            properties:
