name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked -- --nocapture
      - name: Plugin catalogue validates
        run: cargo run -q -p secuscan-cli --locked -- plugins validate ./plugins

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: e2e (verify.mjs)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA (served by the API)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build release server
        run: cargo build --locked --release --bin secuscan-server
      - name: Product-surface E2E
        run: node scripts/verify.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t secuscan-v2:ci .
      - name: Smoke health + login + SPA
        run: |
          set -euo pipefail
          mkdir -p /tmp/secuscan-ci-data && chmod 777 /tmp/secuscan-ci-data
          docker run -d --name secuscan-ci \
            -p 18080:8080 \
            -v /tmp/secuscan-ci-data:/app/data \
            -e SECUSCAN_ADDR=0.0.0.0:8080 \
            -e SECUSCAN_ADMIN_EMAIL=admin@secuscan.local \
            -e SECUSCAN_ADMIN_PASSWORD=CiSmokePass1 \
            -e SECUSCAN_JWT_SECRET=ci-smoke-secret-32bytes-long-aaaa \
            secuscan-v2:ci
          trap 'docker logs secuscan-ci || true; docker rm -f secuscan-ci || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"version"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>SecuScan</title>'
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@secuscan.local","password":"CiSmokePass1"}' \
            | grep -q '"access_token"'
