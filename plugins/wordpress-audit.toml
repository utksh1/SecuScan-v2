# WordPress Scanner — native WPScan-equivalent audit (Sprint 2.2, #26).
[plugin]
id = "wordpress-audit"
name = "WordPress Scanner"
version = "2.0.0"
description = "WPScan-equivalent WordPress audit: user enum (3 vectors), plugins/themes, backups, XML-RPC, debug logs"
long_description = """
Native WordPress audit with the WPScan-equivalent passive surface:

1. Core version disclosure (meta generator / readme).
2. User enumeration via three vectors: REST API, author archives (?author=N
   redirects) — login-error differential is roadmap.
3. Vulnerable plugin/theme discovery: directory listings + probes of common
   vulnerable plugins' readme/changelog paths.
4. Config backups + DB exports (wp-config.bak, *.sql, etc.).
5. Interesting findings: XML-RPC enabled, wp-cron reachable, readme.html,
   debug.log, uploads listing, TimThumb.

GET-only and non-destructive; severity capped at High (parity). Nuclei's
WordPress templates remain available as a companion engine.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "wordpress"
difficulty = "intermediate"
tags = ["web", "wordpress", "cms"]

[engine]
type = "native"
native = "wordpress_audit"
timeout_seconds = 900

[[fields]]
id = "target"
label = "Target URL"
type = "string"
required = true
placeholder = "https://blog.example.com"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_-]*$'
message = "Must be a URL"

[[fields]]
id = "enum_users"
label = "Enumerate users (3 vectors)"
type = "boolean"
default = true

[[fields]]
id = "enum_plugins"
label = "Discover plugins"
type = "boolean"
default = true

[[fields]]
id = "enum_themes"
label = "Discover themes"
type = "boolean"
default = true

[[fields]]
id = "check_backups"
label = "Check config/DB backups"
type = "boolean"
default = true

[[fields]]
id = "check_interesting"
label = "Check XML-RPC / wp-cron / readme / debug.log"
type = "boolean"
default = true

[[fields]]
id = "timeout_ms"
label = "Request timeout (ms)"
type = "integer"
default = 12000
min = 1000
max = 60000

[safety]
level = "safe"
requires_consent = true
consent_message = "Only scan WordPress sites you own or are authorized to assess."
allowed_targets = ["*"]
max_concurrent = 3
max_per_hour = 20
capabilities = ["http.request"]

# ---------------------------------------------------------------- presets ---

[presets.quick]
enum_users = true
enum_plugins = false
enum_themes = false
check_backups = false

[preset_meta.quick]
label = "Quick"
description = "User enumeration + interesting findings only."
badge = "fast"

[presets.deep]
enum_users = true
enum_plugins = true
enum_themes = true
check_backups = true
check_interesting = true
timeout_ms = 20000

[preset_meta.deep]
label = "Deep"
description = "Full passive audit: all enumeration toggles and backup probes."
badge = "thorough"

[presets.stealth]
enum_users = true
enum_plugins = false
enum_themes = false
check_backups = false
check_interesting = true
timeout_ms = 20000

[preset_meta.stealth]
label = "Stealth"
description = "Low-and-slow: user enum + interesting findings with a long timeout."
badge = "stealth"
