[package]
name = "secuscan-oob-dns"
description = "SecuScan v2 DNS OOB receiver: authoritative DNS server for blind-vulnerability callback correlation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
secuscan-db = { path = "../db" }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }
chrono = { workspace = true }
hickory-server = { version = "0.24", optional = true }
hickory-resolver = { version = "0.24", optional = true }
hickory-proto = { version = "0.24", optional = true }
