      - graph
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        graph:
          type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    AuthProfile:
      type: object
