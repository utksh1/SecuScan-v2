name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify formatting
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
      - name: Run workspace tests
        run: cargo test --workspace --locked

  plugin-catalog:
    name: Plugin catalog validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugin-catalog
      - name: Validate plugin manifests
        run: cargo run -q -p secuscan-cli --locked -- plugins validate ./plugins

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: e2e (verify.mjs)
    needs: [rust-tests, plugin-catalog, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA (served by the API)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build release server
        run: cargo build --locked --release --bin secuscan-server
      - name: Product-surface E2E
        run: node scripts/verify.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t secuscan-v2:ci .
      - name: Reject missing and weak JWT secrets
        run: |
          set -euo pipefail
          # Compose must fail before starting containers with a missing key.
          if env -u SECUSCAN_JWT_SECRET docker compose -f docker/docker-compose.yml config --quiet > /tmp/secuscan-compose-no-key.log 2>&1; then
            echo 'SECURITY FAILURE: Compose accepted a missing JWT secret'
            exit 1
          fi
          # The server must also reject absent or public placeholder keys.
          if docker run --rm secuscan-v2:ci > /tmp/secuscan-no-key.log 2>&1; then
            echo 'SECURITY FAILURE: server started without a JWT secret'
            exit 1
          fi
          grep -q 'SECUSCAN_JWT_SECRET is required in production' /tmp/secuscan-no-key.log
          if docker run --rm -e SECUSCAN_JWT_SECRET=change-me-openssl-rand-hex-32 secuscan-v2:ci > /tmp/secuscan-weak-key.log 2>&1; then
            echo 'SECURITY FAILURE: server accepted the public placeholder JWT key'
            exit 1
          fi
          grep -q 'SECUSCAN_JWT_SECRET must be a persistent' /tmp/secuscan-weak-key.log
      - name: Smoke health + login + SPA
        run: |
          set -euo pipefail
          mkdir -p /tmp/secuscan-ci-data && chmod 777 /tmp/secuscan-ci-data
          jwt_secret="$(openssl rand -hex 32)"
          docker run -d --name secuscan-ci \
            -p 127.0.0.1:18080:8080 \
            -v /tmp/secuscan-ci-data:/app/data \
            -e SECUSCAN_ADDR=0.0.0.0:8080 \
            -e SECUSCAN_ENV=production \
            -e SECUSCAN_ADMIN_EMAIL=admin@secuscan.local \
            -e SECUSCAN_ADMIN_PASSWORD=CiSmokePass1 \
            -e SECUSCAN_JWT_SECRET="$jwt_secret" \
            secuscan-v2:ci
          trap 'docker logs secuscan-ci || true; docker rm -f secuscan-ci || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"version"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>SecuScan</title>'
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@secuscan.local","password":"CiSmokePass1"}' \
            | grep -q '"access_token"'
