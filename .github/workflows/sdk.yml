# SDK generation + publish (Sprint 4, issue #34)
# Python (openapi-generator) + TypeScript (openapi-typescript-codegen) from
# the committed docs/openapi.json. Runs on tag pushes; artifacts are
# uploaded for review before manual publish.
name: SDK generation
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Generate Python SDK
        run: |
          docker run --rm -v "$PWD:/out" openapitools/openapi-generator-cli:v7.6.0 generate \
            -i /out/docs/openapi.json -g python \
            -o /out/sdks/python --additional-properties=packageName=secuscan-sdk,projectName=secuscan-sdk
      - uses: actions/upload-artifact@v4
        with: { name: python-sdk, path: sdks/python }
  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate TypeScript SDK
        run: |
          docker run --rm -v "$PWD:/out" openapitools/openapi-generator-cli:v7.6.0 generate \
            -i /out/docs/openapi.json -g typescript-axios \
            -o /out/sdks/typescript --additional-properties=packageName=@secuscan/sdk,npmName=@secuscan/sdk
      - uses: actions/upload-artifact@v4
        with: { name: typescript-sdk, path: sdks/typescript }
