openapi: 3.1.0
info:
  title: SecuScan v2 API
  version: 3.1.2
  description: 'Pentest automation platform: 35-plugin scanner catalog, task lifecycle, finding triage, Pentest Robots DAG,
    Sniper Auto-Exploiter, VPN-aware scanning, OOB callbacks, notifications, and report generation.


    All endpoints (except `/auth/login`, `/auth/register`, `/health`, and `/oob/:secret`) require authentication via either
    a Bearer JWT (`Authorization: Bearer <token>`) or an API key (`x-api-key: <key>`).'
  contact:
    name: SecuScan
    url: https://github.com/utksh1/SecuScan-v2
  license:
    name: MIT
servers:
- url: /api/v1
  description: Same-origin (default)
- url: http://127.0.0.1:8080/api/v1
  description: Local dev
tags:
- name: Auth
- name: Plugins
- name: Tasks
- name: Findings
- name: Reports
- name: Workflows
- name: Workspaces
- name: Targets
- name: Schedules
- name: Dashboard
- name: Admin
- name: Robots
- name: AttackSurface
- name: AuthProfiles
- name: Collab
- name: Branding
- name: OOB
- name: Notifications
- name: ScanGroups
- name: Wordlists
- name: FindingTemplates
- name: AssetImports
- name: Sniper
- name: VPN
- name: OpenAPI
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Exchange email + password for a JWT access token.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register
      description: Register a new user (admin-only in production).
      security: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
  /auth/me:
    get:
      tags:
      - Auth
      summary: Current user
      description: Return the calling user's profile.
      security: &id001
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh token
      description: Issue a new JWT from a valid one.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Invalidate the current session.
      security: *id001
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/password:
    post:
      tags:
      - Auth
      summary: Change password
      description: Change the current user's password.
      security: *id001
      responses:
        '200':
          description: OK
        '400':
          description: Weak new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
  /auth/api-keys:
    get:
      tags:
      - Auth
      summary: List API keys
      description: List the current user's API keys.
      security: *id001
      responses:
        '200':
          description: OK
    post:
      tags:
      - Auth
      summary: Create API key
      description: Issue a new API key. The plaintext key is returned only once.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  key:
                    type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
  /auth/api-keys/:id:
    delete:
      tags:
      - Auth
      summary: Revoke API key
      description: Revoke an API key by id.
      security: *id001
      responses:
        '204':
          description: No content
        '404':
          description: No such key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
    get:
      tags:
      - Auth
      summary: Health check
      description: Liveness probe.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /plugins:
    get:
      tags:
      - Plugins
      summary: List plugins
      description: List all 35 plugins in the catalog with availability and enabled flags.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plugin'
  /plugins/:id:
    get:
      tags:
      - Plugins
      summary: Get plugin
      description: Fetch a single plugin manifest.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '404':
          description: No such plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Plugin id.
        schema:
          type: string
  /plugins/:id/schema:
    get:
      tags:
      - Plugins
      summary: Plugin schema
      description: Return the JSON schema for the plugin's input fields.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Plugin id.
        schema:
          type: string
  /plugins/:id/preview:
    post:
      tags:
      - Plugins
      summary: Preview command
      description: Preview the shell command a plugin would execute.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: string
      parameters:
      - name: id
        in: path
        required: true
        description: Plugin id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
  /plugins/:id/enabled:
    put:
      tags:
      - Plugins
      summary: Set enabled
      description: Enable or disable a plugin (admin only).
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '403':
          description: Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Plugin id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
  /tasks:
    post:
      tags:
      - Tasks
      summary: Start task
      description: Submit a new scan task. The VPN-aware admission gate may reject with 409.
      security: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Target outside plugin's allowed_targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Workspace VPN tunnel cannot come up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Plugin requires consent_granted=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: workspace_id
        in: query
        required: false
        description: Workspace scope (overrides request body).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTaskRequest'
    get:
      tags:
      - Tasks
      summary: List tasks
      description: List tasks for the current user, optionally filtered.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          type: string
      - name: workspace_id
        in: query
        required: false
        description: Filter by workspace.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Limit (default 100).
        schema:
          type: integer
  /tasks/:id:
    get:
      tags:
      - Tasks
      summary: Get task
      description: Fetch a single task by id.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
    delete:
      tags:
      - Tasks
      summary: Delete task
      description: Delete a task (admin or owner).
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
      responses:
        '204':
          description: No content
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/:id/cancel:
    post:
      tags:
      - Tasks
      summary: Cancel task
      description: Cancel a queued or running task.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Task already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/retry:
    post:
      tags:
      - Tasks
      summary: Replay task (retry)
      description: Re-run a task with the same plugin, inputs, and workspace. Consent is inherited from the original task.
        The VPN-aware admission gate still applies.
      security: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Workspace VPN tunnel cannot come up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/result:
    get:
      tags:
      - Tasks
      summary: Task result
      description: Fetch a task's findings and severity counts.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/output:
    get:
      tags:
      - Tasks
      summary: Raw output
      description: Fetch the raw tool stdout (truncated for list views).
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/stream:
    get:
      tags:
      - Tasks
      summary: Stream task events (SSE)
      description: Server-Sent Events stream of task state changes.
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
  /tasks/:id/diff:
    get:
      tags:
      - Tasks
      summary: Diff vs previous run
      description: Compare this task's findings against the previous run of the same plugin+target.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/reports:
    get:
      tags:
      - Reports
      summary: List reports for task
      description: List report jobs generated for this task.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
  /tasks/:id/report/:format:
    post:
      tags:
      - Reports
      summary: Generate report for task
      description: Queue a single-task report in the given format (pdf/html/csv/xlsx/json).
      security: *id001
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      parameters:
      - name: id
        in: path
        required: true
        description: Task id.
        schema:
          type: string
      - name: format
        in: path
        required: true
        description: Report format.
        schema:
          type: string
  /findings:
    get:
      tags:
      - Findings
      summary: List findings
      description: List findings across the user's tasks, filtered by severity, kind, status, workspace, search.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
                  total:
                    type: integer
      parameters:
      - name: severity
        in: query
        required: false
        description: 'Repeatable: filter by severity.'
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Filter by finding kind.
        schema:
          type: string
      - name: analyst_status
        in: query
        required: false
        description: Filter by triage status.
        schema:
          type: string
      - name: workspace_id
        in: query
        required: false
        description: Filter by workspace.
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Full-text search on title/description.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Limit.
        schema:
          type: integer
  /findings/:id:
    get:
      tags:
      - Findings
      summary: Get finding
      description: Fetch a single finding by id (includes enrichment fields).
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Finding id.
        schema:
          type: string
  /findings/:id/triage:
    patch:
      tags:
      - Findings
      summary: Triage finding
      description: Update the analyst_status of a finding (new/confirmed/needs_review/false_positive/accepted_risk/fixed).
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
      parameters:
      - name: id
        in: path
        required: true
        description: Finding id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - analyst_status
              properties:
                analyst_status:
                  type: string
  /findings/:id/comments:
    get:
      tags:
      - Collab
      summary: List comments
      description: List collaboration comments on a finding.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Finding id.
        schema:
          type: string
    post:
      tags:
      - Collab
      summary: Add comment
      description: Add a comment to a finding. @mentions create notifications.
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Finding id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
  /reports:
    post:
      tags:
      - Reports
      summary: Queue report
      description: Queue a workspace-scoped report job.
      security: *id001
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - format
              properties:
                format:
                  type: string
                workspace_id:
                  type: string
                severity_filter:
                  type: array
                  items:
                    type: string
    get:
      tags:
      - Reports
      summary: List reports
      description: List recent report jobs.
      security: *id001
      responses:
        '200':
          description: OK
  /reports/:id/download:
    get:
      tags:
      - Reports
      summary: Download report
      description: Download a completed report file (PDF/HTML/CSV/XLSX/JSON).
      security: *id001
      responses:
        '200':
          description: Binary file.
      parameters:
      - name: id
        in: path
        required: true
        description: Report id.
        schema:
          type: string
  /workflows:
    get:
      tags:
      - Workflows
      summary: List workflows
      description: List all workflow definitions.
      security: *id001
      responses:
        '200':
          description: OK
    post:
      tags:
      - Workflows
      summary: Create workflow
      description: Define a new multi-step workflow.
      security: *id001
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - steps
              properties:
                name:
                  type: string
                description:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
  /workflows/:id:
    get:
      tags:
      - Workflows
      summary: Get workflow
      description: Get workflow
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Workflow id.
        schema:
          type: string
    delete:
      tags:
      - Workflows
      summary: Delete workflow
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        description: Workflow id.
        schema:
          type: string
      responses:
        '204':
          description: No content
        '404':
          description: No such workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workflows/:id/run:
    post:
      tags:
      - Workflows
      summary: Run workflow
      description: Start a workflow run.
      security: *id001
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
      parameters:
      - name: id
        in: path
        required: true
        description: Workflow id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
  /workflows/:id/runs:
    get:
      tags:
      - Workflows
      summary: List workflow runs
      description: List workflow runs
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Workflow id.
        schema:
          type: string
  /workspaces:
    get:
      tags:
      - Workspaces
      summary: List workspaces
      description: List all workspaces with task/target counts. The Personal workspace is always present.
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  personal:
                    $ref: '#/components/schemas/Workspace'
    post:
      tags:
      - Workspaces
      summary: Create workspace
      description: Create a new workspace.
      security: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
  /workspaces/:id:
    get:
      tags:
      - Workspaces
      summary: Get workspace
      description: Get workspace
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Workspace id.
        schema:
          type: string
    patch:
      tags:
      - Workspaces
      summary: Update workspace
      description: Update workspace
      security: *id001
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        description: Workspace id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
    delete:
      tags:
      - Workspaces
      summary: Delete workspace
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        description: Workspace id.
        schema:
          type: string
      responses:
        '204':
          description: No content
        '409':
