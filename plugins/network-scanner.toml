# Unified Network Scanner — composes nmap version-based, nuclei and testssl
# with per-engine toggles, CISA-KEV-only mode and a custom-CVE allowlist
# (Sprint 2.3, issue #28).
[plugin]
id = "network-scanner"
name = "Unified Network Scanner"
version = "1.0.0"
description = "Single-tool network vuln scan: nmap version detection + nuclei + testssl.sh with per-engine toggles"
long_description = """
Composes three detection engines behind one admission and one result set:

1. nmap version-based scanning (with the VULNERABLE static-rule match for
   CVE banners)
2. Nuclei network templates (optional CISA-KEV-only filter)
3. testssl.sh TLS/SSL evaluation

Each engine is independently toggleable. The custom-CVE allowlist caps at
500 entries (each is checked against nuclei's template tags). CIDR/range
targets accepted.
"""
category = "network"
author = "SecuScan Contributors"
license = "MIT"
icon = "shield"
difficulty = "intermediate"
tags = ["network", "vulnerability", "multi-engine"]

[engine]
type = "native"
native = "network_scanner"
timeout_seconds = 3600

[[fields]]
id = "target"
label = "Target (host, CIDR or range)"
type = "string"
required = true
placeholder = "10.0.0.0/24 or scanme.internal"

[[fields]]
id = "engine_nmap"
label = "nmap version scan"
type = "boolean"
default = true

[[fields]]
id = "engine_nuclei"
label = "nuclei network templates"
type = "boolean"
default = true

[[fields]]
id = "engine_testssl"
label = "testssl.sh"
type = "boolean"
default = false
help = "Requires testssl.sh installed; long-running (minutes per host+port)."

[[fields]]
id = "nuclei_kev_only"
label = "CISA KEV only"
type = "boolean"
default = false
help = "Restricts nuclei to CISA Known Exploited Vulnerabilities templates."

[[fields]]
id = "custom_cves"
label = "Custom CVE allowlist"
type = "string"
placeholder = "CVE-2021-44228,CVE-2020-0796"
help = "Comma-separated CVE ids (max 500); restricts nuclei to these templates."

[[fields]]
id = "rps"
label = "Requests per second (nuclei)"
type = "integer"
default = 150
min = 1
max = 1000

[[fields]]
id = "ports"
label = "Ports"
type = "string"
default = "top-100"
placeholder = "top-100, or 22,80,443, or 1-65535"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Network vulnerability scanning affects hosts and networks. Only scan systems you own or are authorized to test."
allowed_targets = ["*"]
max_concurrent = 2
max_per_hour = 10
capabilities = ["network.connect", "http.request"]

# ---------------------------------------------------------------- presets ---

[presets.quick]
engine_nmap = true
engine_nuclei = true
engine_testssl = false
nuclei_kev_only = true
rps = 300
ports = "top-100"

[preset_meta.quick]
label = "Quick"
description = "nmap top-100 + nuclei KEV-only at 300 RPS; no testssl."
badge = "fast"

[presets.deep]
engine_nmap = true
engine_nuclei = true
engine_testssl = true
nuclei_kev_only = false
rps = 150
ports = "1-65535"

[preset_meta.deep]
label = "Deep"
description = "All three engines; full port range; testssl enabled."
badge = "intense"

[presets.tls]
engine_nmap = false
engine_nuclei = false
engine_testssl = true
ports = "443,8443,995,993,465"

[preset_meta.tls]
label = "TLS Only"
description = "testssl.sh against TLS ports only."
badge = "thorough"
