# ffuf wrapper — fast web fuzzer (URL Fuzzer parity).
[plugin]
id = "ffuf"
name = "URL Fuzzer (ffuf)"
version = "1.1.0"
description = "Discover hidden paths with ffuf and a wordlist"
long_description = """
Wraps ffuf for fast content discovery: fuzzes the FUZZ placeholder in the
target URL against a wordlist and reports every match with status and size.
The default match filter keeps only successful/interesting response codes.

v4.2.1 adds two one-click scan profiles (Quick / Deep) that mirror the
pentest-tools.com customization surface — Quick runs a flat common-wordlist
pass at 40 threads with no recursion (seconds), Deep doubles the thread
count and enables two-level recursion with extended match codes.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "zap"
difficulty = "intermediate"
tags = ["web", "fuzzing", "directories", "http"]

[engine]
type = "cli"
binary = "ffuf"
timeout_seconds = 1800
output_format = "text"
argv = [
  "ffuf",
  "-u", "{target}",
  "-w", "{wordlist}",
  "-mc", "{match_codes}",
  "-t", "{threads}",
  # Sprint 3.2 (#31): ffuf's own auto-calibration filters responses that
  # match the baseline size/word/line profile — the fuzzer-side twin of the
  # website scanner's soft-404 classifier (both fight 404 noise).
  "--if:auto_calibrate:then:-ac",
  "--if:auto_calibrate:then:-acs",
  "--if:recursion:then:-recursion",
  "--if:recursion:then:-recursion-depth",
  "--if:recursion:then:{recursion_depth}",
]

[[fields]]
id = "target"
label = "Target URL (include FUZZ marker)"
type = "string"
required = true
placeholder = "https://example.com/FUZZ"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~{}-]*$'
message = "Must be a URL containing FUZZ where the wordlist is inserted"
help = "Example: https://example.com/FUZZ or https://example.com/blog/FUZZ.php"

[[fields]]
id = "wordlist"
label = "Wordlist path"
type = "string"
default = "/usr/share/wordlists/dirb/common.txt"
placeholder = "~/tools/wordlists/common.txt"
pattern = '^[/~a-zA-Z0-9._-]+$'
message = "Path to a wordlist file"

[[fields]]
id = "match_codes"
label = "Match HTTP status codes"
type = "string"
default = "200,204,301,302,307,401,403,405,500"
placeholder = "200,204,301,302,307,401,403,405,500"
pattern = '^[0-9, ]+$'
message = "Comma-separated HTTP status codes"
help = "ffuf -mc. Deep profile extends to all 2xx/3xx/4xx/5xx for fuller coverage."

[[fields]]
id = "threads"
label = "Threads"
type = "integer"
default = 40
min = 1
max = 200

[[fields]]
id = "extensions"
label = "Extensions"
type = "string"
default = ""
placeholder = "php,html,txt,json"
help = "Comma-separated extension list — ffuf tries each word with every extension."

[[fields]]
id = "request_headers"
label = "Custom headers"
type = "string"
default = ""
placeholder = "X-Custom: value"
help = "One header per line (key: value), sent with every request."

[[fields]]
id = "request_method"
label = "Method"
type = "select"
default = "GET"
options = [
  { value = "GET", label = "GET" },
  { value = "POST", label = "POST" },
  { value = "PUT", label = "PUT" },
  { value = "PATCH", label = "PATCH" },
]

[[fields]]
id = "request_body"
label = "Request body (POST/PUT/PATCH)"
type = "string"
default = ""
placeholder = 'key=FUZZ&other=value'
help = "Body for non-GET requests; FUZZ is replaced with the word."

[[fields]]
id = "auto_calibrate"
label = "Auto-calibrate filters"
type = "boolean"
default = true
help = "ffuf filters responses matching the baseline size/word/line profile (-ac) — removes soft-404 noise from results."

[[fields]]
id = "recursion"
label = "Recursive fuzzing"
type = "boolean"
default = false
help = "Re-fuzz discovered directories. Disabled in Quick, enabled in Deep."

[[fields]]
id = "recursion_depth"
label = "Recursion depth"
type = "integer"
default = 2
min = 1
max = 5
help = "How many directory levels to descend when recursion is enabled."

[parser]
type = "line_regex"
# ffuf -s prints one line per match:
#   admin                   [Status: 200, Size: 34, Words: 5, Lines: 1, Duration: 1ms]
pattern = '^(?P<path>\S+)\s+\[Status:\s*(?P<status>\d+),\s*Size:\s*(?P<size>\d+)'
metadata_fields = ["path", "status", "size"]

[parser.finding]
title = "Discovered path: /{path} (HTTP {status})"
description = "ffuf found /{path} on the target (HTTP {status}, {size} bytes)."
remediation = "Review whether this path should be exposed; restrict or remove what is not needed."
proof = "{path} [Status: {status}, Size: {size}]"
category = "Content Discovery"
severity = "info"

[[parser.severity_rules]]
field = "path"
values = [".env*", ".git*", "backup*", "admin*", "wp-admin*", "phpmyadmin*", "server-status*", ".htaccess*", "debug*"]
severity = "medium"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "ffuf sends one request per wordlist entry. Only scan authorized targets."
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
binaries = ["ffuf"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
wordlist = "/usr/share/wordlists/dirb/common.txt"
match_codes = "200,204,301,302,307,401,403,405,500"
threads = 40
recursion = false
recursion_depth = 1

[preset_meta.quick]
label = "Quick"
description = "Flat common-wordlist pass at 40 threads, no recursion. Seconds-fast triage of obvious paths."
badge = "fast"

[presets.deep]
wordlist = "/usr/share/wordlists/dirb/common.txt"
match_codes = "200,204,301,302,307,401,403,405,500"
threads = 80
recursion = true
recursion_depth = 2

[preset_meta.deep]
label = "Deep"
description = "Doubles thread count and enables two-level recursion. Walks discovered directories one level deeper."
badge = "intense"
