# gobuster wrapper — directory & file brute-forcing.
[plugin]
id = "gobuster"
name = "Directory Discovery (gobuster)"
version = "2.1.0"
description = "Discover hidden paths and files with a wordlist"
long_description = """
Wraps gobuster's `dir` mode to brute-force web paths from a wordlist. Found
paths become observations; the wordlist and extensions are configurable and
the default preset is intentionally conservative.

v4.2.1 adds two one-click scan profiles (Quick / Deep) that mirror the
pentest-tools.com customization surface — Quick runs the common wordlist at
10 threads with no extensions, Deep adds the standard extension set
(php,bak,old,txt,json) and quintuples the thread count.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "folder-search"
difficulty = "intermediate"
tags = ["directories", "brute-force", "http"]

[engine]
type = "cli"
binary = "gobuster"
timeout_seconds = 1800
output_format = "text"
argv = [
  "gobuster", "dir",
  "-u", "{target}",
  "-w", "{wordlist}",
  "-q",
  "--no-error",
  "--if:extensions:then:-x",
  "--if:extensions:then:{extensions}",
  "-t", "{threads}",
  "--if:follow_redirects:then:-r",
]

[[fields]]
id = "target"
label = "Target URL"
type = "string"
required = true
placeholder = "https://example.com/"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~-]*$'
message = "Must be a valid URL"

[[fields]]
id = "wordlist"
label = "Wordlist path"
type = "string"
default = "/usr/share/wordlists/dirb/common.txt"
placeholder = "/usr/share/wordlists/dirb/common.txt"
pattern = '^[a-zA-Z0-9/._~-]+$'
message = "Absolute path to a wordlist file"
help = "Server-side path readable by the SecuScan process."

[[fields]]
id = "extensions"
label = "Extensions"
type = "string"
placeholder = "php,bak,old"
pattern = '^[a-zA-Z0-9, ]*$|^$'
message = "Comma-separated extensions"
help = "Empty in the Quick profile; Deep adds php,bak,old,txt,json."

[[fields]]
id = "threads"
label = "Threads"
type = "integer"
default = 10
min = 1
max = 100

[[fields]]
id = "follow_redirects"
label = "Follow redirects (-r)"
type = "boolean"
default = false
help = "Follow 3xx redirects. Disabled in Quick, enabled in Deep."

[parser]
type = "line_regex"
# gobuster >= 3.5 prints `admin            (Status: 200) [Size: 34]`
# (no "Found:" prefix, no leading slash); older releases printed
# `Found: /admin (Status: 200)`. The optional prefix + optional leading
# slash normalize both formats to the same `path` capture.
pattern = '^(?:Found:\s+)?/?(?P<path>\S+?)\s+\(Status:\s+(?P<status>\d+)\)'

[parser.finding]
title = "Discovered path: /{path} (HTTP {status})"
description = "The path /{path} exists and returned HTTP {status}."
remediation = "Verify that /{path} should be publicly reachable; remove or protect it otherwise."
proof = "/{path} (Status: {status})"
category = "Content Discovery"
severity = "info"

[[parser.severity_rules]]
field = "path"
values = [".env*", ".git*", ".svn*", ".aws*", "backup*", "admin*", "phpmyadmin*", "config*", "secret*", "dump*", "*.sql", "*.bak", "*.old", "*.swp"]
severity = "medium"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Directory brute-forcing generates high request volumes. Only scan authorized targets."
max_concurrent = 1
max_per_hour = 6
capabilities = ["network"]

[dependencies]
binaries = ["gobuster"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
wordlist = "/usr/share/wordlists/dirb/common.txt"
extensions = ""
threads = 10
follow_redirects = false

[preset_meta.quick]
label = "Quick"
description = "Common wordlist, 10 threads, no extensions, no redirect following. Lowest request volume."
badge = "fast"

[presets.deep]
wordlist = "/usr/share/wordlists/dirb/common.txt"
extensions = "php,bak,old,txt,json"
threads = 50
follow_redirects = true

[preset_meta.deep]
label = "Deep"
description = "Adds the standard extension set (php,bak,old,txt,json), 5x thread count, and follows redirects."
badge = "intense"
