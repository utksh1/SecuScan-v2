# Native reverse-DNS (PTR) lookup — runs in-process.
[plugin]
id = "reverse-dns"
name = "Reverse DNS (PTR)"
version = "1.0.0"
description = "Resolve PTR records for an IP to reveal assigned hostnames"
long_description = """
Resolves the in-addr.arpa / ip6.arpa PTR name for an IP address. Descriptive
internal hostnames can leak naming conventions, and missing PTR records on
mail servers cause immediate delivery problems. Runs natively — no external
binaries needed.
"""
category = "recon"
author = "SecuScan Contributors"
license = "MIT"
icon = "arrow-up-down"
difficulty = "beginner"
tags = ["dns", "recon", "passive"]

[engine]
type = "native"
native = "reverse_dns"
timeout_seconds = 120

[[fields]]
id = "target"
label = "IP address"
type = "string"
required = true
placeholder = "192.0.2.10 or 2001:db8::1"
pattern = '^[0-9a-fA-F.:\[\]]+$'
message = "Must be an IPv4 or IPv6 address"

[safety]
level = "safe"
requires_consent = true
consent_message = "DNS lookups are sent to your configured resolver."
max_concurrent = 4
max_per_hour = 120
capabilities = ["network"]

[dependencies]
