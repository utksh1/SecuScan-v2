# Temporary scoped formatter for issue #2 on PR #16. Deleted after completion.
name: pr16-rustfmt-once
on:
  push:
    branches:
      - ci/issue-2-independent-quality-gates
    paths:
      - .github/workflows/pr16-rustfmt-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'utksh1/SecuScan-v2' && github.ref == 'refs/heads/ci/issue-2-independent-quality-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ci/issue-2-independent-quality-gates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          if ! git diff --quiet -- crates; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates
            git commit -m "style(rust): format native scanner Clippy fixes (#2)"
            git push origin HEAD:ci/issue-2-independent-quality-gates
          fi
