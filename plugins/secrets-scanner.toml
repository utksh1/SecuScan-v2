# gitleaks wrapper -- secret detection (v4.1.0 Power Engine).
#
# gitleaks (gitleaks/gitleaks) is the strongest open-source secret
# scanner: AWS / Google Cloud / Azure / GitHub PAT / Slack / GitLab
# / Stripe / Twilio / SendGrid / Mailgun / JWT / private-key /
# connection-string patterns, with context-aware false-positive
# suppression (test/example values are filtered). pentest-tools.com
# has no equivalent; this fills the gap by scanning any URL the
# platform already targets for accidentally-committed secrets in
# linked .env / .git/config / source files.
[plugin]
id = "secrets-scanner"
name = "Secrets Scanner (gitleaks)"
version = "1.1.0"
description = "Detects leaked secrets: AWS/GCP/Azure keys, GitHub PAT, Slack, JWT, private keys"
long_description = """
Wraps gitleaks/gitleaks, the strongest open-source secret scanner.
gitleaks covers AWS Access Keys, GCP service-account JSON, Azure
storage keys, GitHub Personal Access Tokens, GitLab tokens, Slack
tokens, Stripe / Twilio / SendGrid / Mailgun API keys, JWTs, PEM
private keys, and 100+ other patterns via a maintained Rules
config. Context-aware suppression filters out test/example
values (AKIATEST, fake keys, etc.). When given a local path it
walks the tree; when pointed at a downloaded URL it scans the
file. Findings land in the `Secret Exposure` category; Sniper
chains re-verify by replaying the gitleaks rule against the same
file and capturing the matched line as proof.

v4.2.1 adds two one-click scan profiles (Quick / Full) that mirror
the pentest-tools.com customization surface — Quick scans the
current HEAD only (seconds, no git history walk), Full walks the
entire git history (`--log-opts=--all`) to catch secrets scrubbed
from later commits.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "key-round"
difficulty = "intermediate"
tags = ["secrets", "leaks", "compliance"]

[engine]
type = "cli"
binary = "gitleaks"
timeout_seconds = 600
output_format = "text"
argv = [
  "gitleaks",
  "detect",
  "--source", "{target}",
  "--no-banner",
  "--no-color",
  "-v",
  "--if:config:then:--config",
  "--if:config:then:{config}",
  "--if:log_opts:then:--log-opts",
  "--if:log_opts:then:{log_opts}",
]

[[fields]]
id = "target"
label = "Target directory or file path"
type = "string"
required = true
placeholder = "/tmp/scanned-site-mirror/"
pattern = '^[a-zA-Z0-9/._~:-]+$'
message = "Must be an absolute path to scan"

[[fields]]
id = "config"
label = "Custom rules config (optional)"
type = "string"
placeholder = "/etc/gitleaks/custom.toml"
pattern = '^[a-zA-Z0-9/._~:-]+$|^$'
message = "Absolute path to a gitleaks config TOML"
help = "Leave empty to use the built-in default ruleset."

[[fields]]
id = "log_opts"
label = "Git log options (--log-opts)"
type = "string"
default = ""
placeholder = "--all or --since=2024-01-01"
pattern = '^[a-zA-Z0-9 =._/-]*$|^$'
message = "git-log-style options"
help = "Empty = scan the current HEAD only (Quick). --all = walk every branch and commit (Full)."

[parser]
type = "line_regex"
# gitleaks v8 verbose output emits one line per finding:
#   /path/to/file:LINE:RULE_ID: SECRET_PREVIEW
# We capture the path, line, rule id, and preview.
pattern = '^(?P<path>[^:\s]+):(?P<line>\d+):(?P<rule>[^:]+):\s*(?P<secret>.+)$'

[parser.finding]
title = "Leaked secret: {rule}"
description = "gitleaks matched the `{rule}` pattern at {path}:{line}. The detected secret preview is `{secret}`."
remediation = "Rotate the exposed secret immediately at the issuing provider. Remove it from history (git filter-repo / BFG). Audit access logs for misuse during the exposure window."
proof = "{path}:{line} [{rule}] {secret}"
category = "Secret Exposure"
severity = "high"

[[parser.severity_rules]]
field = "rule"
values = ["aws-access-token", "aws-secret", "gcp-service-account", "azure-storage-key", "github-pat", "gitlab-pat", "private-key", "jwt"]
severity = "critical"

[[parser.severity_rules]]
field = "rule"
values = ["slack-token", "stripe-token", "twilio-token", "sendgrid-api", "mailgun-api"]
severity = "high"

[[static_rules]]
pattern = '(?i)leaks?\s*:\s*\d+'
title = "gitleaks detected leaked secrets"
severity = "high"
description = "gitleaks found one or more leaked secrets. See the raw output for the file, line, and rule id."
remediation = "Rotate the secret at the issuing provider; remove from history; audit for misuse during the exposure window."
category = "Secret Exposure"

[safety]
level = "safe"
requires_consent = true
consent_message = "gitleaks reads files locally -- no active probing. The target path is read-only."
max_concurrent = 2
max_per_hour = 30
capabilities = ["filesystem"]

[dependencies]
binaries = ["gitleaks"]

# ---------------------------------------------------------------- profiles ---

[presets.quick]
log_opts = ""

[preset_meta.quick]
label = "Quick"
description = "Scan the current HEAD only (no git history walk). Seconds-fast triage of the latest tree state."
badge = "fast"

[presets.full]
log_opts = "--all"

[preset_meta.full]
label = "Full"
description = "Walk every branch and commit (--log-opts=--all). Catches secrets scrubbed from later commits; the only way to be sure."
badge = "intense"
