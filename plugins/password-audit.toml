# Native HTTP Basic default-credential auditor.
[plugin]
id = "password-audit"
name = "Password Auditor (HTTP Basic)"
version = "1.0.0"
description = "Test HTTP Basic auth against well-known default credentials"
long_description = """
Checks whether a Basic-auth protected URL still accepts default or
never-changed credentials (admin:admin, root:toor, vendor defaults for
routers/cameras/tomcat, ...). The embedded list is intentionally small —
default pairs only, not a brute-force dictionary.
"""
category = "exploitation"
author = "SecuScan Contributors"
license = "MIT"
icon = "key-round"
difficulty = "intermediate"
tags = ["auth", "passwords", "http", "defaults"]

[engine]
type = "native"
native = "password_audit"
timeout_seconds = 600

[[fields]]
id = "target"
label = "Target URL (Basic-auth protected)"
type = "string"
required = true
placeholder = "https://router.example.com/admin"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~-]*$'
message = "Must be a valid URL"

[[fields]]
id = "wordlist"
label = "Custom credentials file (optional)"
type = "string"
placeholder = "/path/to/creds.txt"
pattern = '^[/a-zA-Z0-9._@!$%^&*()-]*$'
help = "Lines of user:pass. Empty = embedded default list."

[[fields]]
id = "timeout_ms"
label = "Request timeout (ms)"
type = "integer"
default = 8000
min = 500
max = 30000

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Sends authentication attempts with known default credential pairs. Only audit systems you own."
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
