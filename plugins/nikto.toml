# nikto wrapper — web server scanner.
[plugin]
id = "nikto"
name = "Web Server Scan (nikto)"
version = "2.0.2"
description = "Well-known web misconfigurations, default files and outdated software"
long_description = """
Wraps nikto for classic web-server checks: dangerous files, misconfigured
CGI, outdated components, and informational disclosures. Findings are parsed
from nikto's default text output; OSVDB-referenced items are elevated to
high severity automatically.
"""
category = "web"
author = "SecuScan Contributors"
license = "MIT"
icon = "scan-search"
difficulty = "intermediate"
tags = ["web", "http", "misconfiguration"]

[engine]
type = "cli"
binary = "nikto"
timeout_seconds = 1800
output_format = "text"
argv = [
  "nikto",
  "-h", "{target}",
  "--if:ssl:then:-ssl",
  "--if:port:then:-p",
  "--if:port:then:{port}",
  "-nointeractive",
]

[[fields]]
id = "target"
label = "Target host or URL"
type = "string"
required = true
placeholder = "http://lab.local or 127.0.0.1"
pattern = '^[a-zA-Z0-9][a-zA-Z0-9.:/_?&=%#~-]*$'
message = "Host or URL"

[[fields]]
id = "port"
label = "Port"
type = "string"
placeholder = "80, 443, 8080"
pattern = '^[0-9]*$'
message = "Numeric port only"

[[fields]]
id = "ssl"
label = "Force SSL"
type = "boolean"
default = false

[parser]
type = "line_regex"
# Summary lines: `+ Server: SimpleHTTP/0.6 Python/3.12.15`
# Check results:  `+ [740001] /backup.zip: Potentially interesting backup file ...`
# Some check lines carry no colon at all (e.g. `[600652] Python/3.12
# appears to be outdated`); the optional `: detail` group keeps them
# parseable while severity_rules key off the numeric check id.
pattern = '^\+\s+(?:\[(?P<check>\d+)\]\s+)?(?P<item>[^:]+?)(?:\s*:\s*(?P<detail>.+))?$'
# Nikto's own diagnostics and run metadata are not security findings:
# `+ ERROR: Failed to check for updates` is nikto failing to phone home,
# and Target IP / Start/End Time / "N host(s) tested" are scan bookkeeping.
skip_patterns = [
  '^\+\s+(ERROR|WARN):',
  '^\+\s+No web server found',
  '^\+\s+(Start|End) Time:',
  '^\+\s+Target (IP|Hostname|Port|Hostname:Port):',
  '^\+\s+\d+ host\(s\) tested',
]

[parser.finding]
title = "{item}"
description = "{detail}"
remediation = "Review the nikto finding and apply the relevant hardening measure."
# No proof template → the verbatim nikto line is stored as evidence.
category = "Web Server"
severity = "info"

[[parser.severity_rules]]
field = "check"
values = ["740001"]
severity = "medium"

[[parser.severity_rules]]
field = "check"
values = ["006609"]
severity = "medium"

[[parser.severity_rules]]
field = "check"
values = ["006230"]
severity = "low"

[[parser.severity_rules]]
field = "check"
values = ["600652", "600720"]
severity = "low"

[[parser.severity_rules]]
field = "check"
values = ["013587", "007342", "007352"]
severity = "low"

[[parser.severity_rules]]
field = "check"
values = ["999997", "999996"]
severity = "low"

# Any other id-carrying check line is at least an observation.
[[parser.severity_rules]]
field = "check"
values = ["??????"]
severity = "low"

[[parser.severity_rules]]
field = "item"
values = ["OSVDB-*"]
severity = "high"

[[static_rules]]
pattern = "Server leaks inodes via ETags"
title = "Server leaks inodes via ETags"
severity = "low"
category = "Web Server"

[safety]
level = "intrusive"
requires_consent = true
consent_message = "Nikto sends many potentially noisy requests. Only scan authorized targets."
max_concurrent = 1
max_per_hour = 10
capabilities = ["network"]

[dependencies]
binaries = ["nikto"]
